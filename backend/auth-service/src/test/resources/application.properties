spring.datasource.url=jdbc:h2:mem:auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
eureka.client.enabled=false
security.jwt.secret=test-only-jwt-secret-with-at-least-32-characters
security.jwt.expiration-ms=3600000
monitoring.api-key=test-only-monitoring-key
monitoring.base-url=http://localhost:9999
