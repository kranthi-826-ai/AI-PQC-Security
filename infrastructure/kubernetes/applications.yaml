apiVersion: apps/v1
kind: Deployment
metadata: {name: ai-security-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: ai-security-service}}
  template:
    metadata: {labels: {app: ai-security-service}}
    spec:
      containers:
        - name: ai-security-service
          image: ai-pqc-security-ai-security-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8090}]
          envFrom: [{configMapRef: {name: ai-pqc-config}}, {secretRef: {name: ai-pqc-secrets}}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts: [{name: models, mountPath: /models, readOnly: true}]
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: ai-models}
---
apiVersion: v1
kind: Service
metadata: {name: ai-security-service}
spec:
  selector: {app: ai-security-service}
  ports: [{name: http, port: 8090, targetPort: http}]
---
