apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-pqc-config
data:
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
  AI_SECURITY_SERVICE_URL: http://ai-security-service:8090
  ADAPTIVE_POLICY_URL: http://adaptive-policy-engine:8091
  AI_MODEL_PATH: /models/model.joblib
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
spec:
  replicas: 1
  selector: {matchLabels: {app: discovery-server}}
  template:
    metadata: {labels: {app: discovery-server}}
    spec:
      containers:
        - name: discovery-server
          image: ai-pqc-security-discovery-server:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8761}]
          env:
            - {name: EUREKA_INSTANCE_HOSTNAME, value: discovery-server}
            - {name: EUREKA_CLIENT_REGISTER_WITH_EUREKA, value: "false"}
            - {name: EUREKA_CLIENT_FETCH_REGISTRY, value: "false"}
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70"}
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: discovery-server}
spec:
  selector: {app: discovery-server}
  ports: [{name: http, port: 8761, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
        - name: api-gateway
          image: ai-pqc-security-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: ai-pqc-config}}, {secretRef: {name: ai-pqc-secrets}}]
          env: [{name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70"}]
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway}
spec:
  type: NodePort
  selector: {app: api-gateway}
  ports: [{name: http, port: 8080, targetPort: http, nodePort: 30080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata: {labels: {app: auth-service}}
    spec:
      containers:
        - name: auth-service
          image: ai-pqc-security-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8081}]
          envFrom: [{configMapRef: {name: ai-pqc-config}}, {secretRef: {name: ai-pqc-secrets}}]
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://mysql:3306/pqc_auth_db?serverTimezone=UTC"}
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70"}
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: auth-service}
spec:
  selector: {app: auth-service}
  ports: [{name: http, port: 8081, targetPort: http}]
---
