apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  01-init.sql: |
    CREATE DATABASE IF NOT EXISTS pqc_auth_db;
    CREATE DATABASE IF NOT EXISTS pqc_business_db;
    CREATE DATABASE IF NOT EXISTS pqc_monitoring_db;
    CREATE DATABASE IF NOT EXISTS pqc_policy_db;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          ports:
            - {name: mysql, containerPort: 3306}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: ai-pqc-secrets, key: DB_PASSWORD}
          readinessProbe:
            exec:
              command: [sh, -c, "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD --silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mysql-data}
        - name: init
          configMap: {name: mysql-init}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: {app: mysql}
  ports:
    - {name: mysql, port: 3306, targetPort: mysql}

